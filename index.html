<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>調査員ジャーナル | Phasmophobia ゴースト特定ツール</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,500&family=IBM+Plex+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

:root{
  --bg: #0c0d12;
  --panel: #171922;
  --panel-alt: #1f232d;
  --line: #2a2e3a;
  --ink-light: #d8d6cf;
  --ink-dim: #8b8f9c;

  --paper: #171922;
  --paper-alt: #232833;
  --paper-line: rgba(255,255,255,.09);
  --ink: #f0eee8;
  --ink-soft: #a2a8b5;

  --accent: #63cfae;
  --accent-dim: #2f6354;
  --danger: #c1554a;
  --danger-dim: #6b2f2a;

  --serif: "Newsreader", Georgia, "Hiragino Mincho ProN", serif;
  --sans: "IBM Plex Sans JP", "Hiragino Sans", sans-serif;
}

*{ box-sizing: border-box; }

body{
  margin:0;
  background: var(--bg);
  color: var(--ink-light);
  font-family: var(--sans);
  -webkit-font-smoothing: antialiased;
}

.app{ display:flex; flex-direction:column; min-height:100vh; }

/* ---------- header ---------- */
.masthead{
  display:flex;
  align-items:center;
  gap:14px;
  padding:20px 18px 16px;
  border-bottom:1px solid var(--line);
  background: linear-gradient(180deg, #14151c, var(--bg));
}
.masthead-mark{
  width:40px; height:40px;
  flex:none;
  display:flex; align-items:center; justify-content:center;
  border:1px solid var(--accent-dim);
  border-radius:50%;
  color:var(--accent);
  font-size:18px;
}
.masthead-text h1{
  font-family: var(--serif);
  font-weight:600;
  font-size:1.35rem;
  margin:0;
  color:#f2f0ea;
}
.masthead-text p{
  margin:2px 0 0;
  font-size:.82rem;
  color: var(--ink-dim);
}
.masthead-count{
  margin-left:auto;
  text-align:right;
  line-height:1;
}
.masthead-count span{
  font-family: var(--serif);
  font-size:1.9rem;
  color: var(--accent);
  display:block;
}
.masthead-count small{
  font-size:.68rem;
  color: var(--ink-dim);
  letter-spacing:.02em;
}

/* ---------- layout ---------- */
.layout{
  flex:1;
  display:grid;
  grid-template-columns: 320px 1fr;
  min-height:0;
}
@media (max-width: 820px){
  .layout{ grid-template-columns: 1fr; }
  .rail{
    border-right:none;
    border-bottom:1px solid var(--line);
    padding: 16px 14px 20px;
    gap:18px;
  }
  .journal{ padding: 16px 12px 32px; }
  .journal-page{ padding: 20px 16px 26px; }
  .masthead{ padding: 16px 14px 14px; }
  .masthead-text h1{ font-size:1.15rem; }
  .masthead-text p{ font-size:.76rem; }
  .ghost-name-ja{ font-size:1.15rem; }
}

/* ---------- rail (filters) ---------- */
.rail{
  background: var(--panel);
  border-right:1px solid var(--line);
  padding: 18px 16px 28px;
  display:flex;
  flex-direction:column;
  gap:22px;
}
.rail-block h2{
  font-family: var(--serif);
  font-size:1rem;
  font-weight:600;
  margin:0 0 4px;
  color:#efeee8;
}
.rail-block-head{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:8px;
}
.rail-hint{
  margin:0 0 10px;
  font-size:.8rem;
  color: var(--ink-dim);
  line-height:1.5;
}

.evidence-list{
  display:flex;
  flex-direction:column;
  gap:8px;
}
.evidence-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  background: var(--panel-alt);
  border:1px solid var(--line);
  border-radius:10px;
  padding:8px 10px 8px 12px;
  transition: border-color .15s, background .15s;
}
.evidence-row[data-state="confirmed"]{
  border-color: var(--accent);
  background:#1c3830;
}
.evidence-row[data-state="excluded"]{
  border-color: var(--danger);
  background:#341f1d;
}
.evidence-name{
  font-size:.86rem;
  font-weight:500;
  line-height:1.3;
  color: var(--ink-light);
}
.evidence-row[data-state="excluded"] .evidence-name{
  color: var(--ink-dim);
  text-decoration: line-through;
  text-decoration-color: rgba(255,255,255,.35);
}
.ev-switch{
  display:flex;
  gap:4px;
  flex:none;
}
.ev-btn{
  border:1px solid var(--line);
  background:#161922;
  color: var(--ink-dim);
  border-radius:8px;
  min-width:52px;
  min-height:40px;
  padding:0 10px;
  font-family: var(--sans);
  font-size:.82rem;
  font-weight:600;
  cursor:pointer;
  transition: background .15s, border-color .15s, color .15s, transform .08s;
  -webkit-tap-highlight-color: transparent;
}
.ev-btn:active{ transform: scale(.94); }
.ev-yes:hover{ border-color: var(--accent); color:#bfeadd; }
.ev-no:hover{ border-color: var(--danger); color:#f4c4bd; }
.ev-yes.is-on{
  background: var(--accent);
  border-color: var(--accent);
  color:#08211a;
}
.ev-no.is-on{
  background: var(--danger);
  border-color: var(--danger);
  color:#2a0d0a;
}

/* 正気度・速度の帯選択ボタン */
.band-grid{
  display:grid;
  grid-template-columns: repeat(3, 1fr);
  gap:8px;
}
.band-grid-4{
  grid-template-columns: repeat(2, 1fr);
}
.band-btn{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:2px;
  border:1px solid var(--line);
  background: var(--panel-alt);
  color: var(--ink-light);
  border-radius:10px;
  padding:12px 8px;
  min-height:56px;
  font-family: var(--sans);
  cursor:pointer;
  transition: border-color .15s, background .15s, color .15s, transform .08s;
  -webkit-tap-highlight-color: transparent;
}
.band-btn:active{ transform: scale(.97); }
.band-btn:hover{ border-color:#3a4050; }
.band-btn strong{
  font-size:.86rem;
  font-weight:600;
}
.band-btn span{
  font-size:.7rem;
  color: var(--ink-dim);
}
.band-btn.is-selected{
  background: var(--accent-dim);
  border-color: var(--accent);
  color:#eafff6;
}
.band-btn.is-selected span{ color:#c9f2e5; }

.reset-btn{
  margin-top:auto;
  background:none;
  border:1px solid var(--line);
  color: var(--ink-dim);
  border-radius:8px;
  padding:10px;
  font-size:.78rem;
  cursor:pointer;
  font-family: var(--sans);
}
.reset-btn:hover{ border-color: var(--danger); color:#ffdcd8; }

/* ---------- journal (results) ---------- */
.journal{
  background:
    radial-gradient(ellipse at top left, rgba(255,255,255,.04), transparent 60%),
    var(--bg);
  padding: 22px;
  overflow-y:auto;
}
.journal-page{
  max-width: 780px;
  margin: 0 auto;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 26px 30px 34px;
  box-shadow: 0 18px 40px rgba(0,0,0,.45);
  min-height: 60vh;
}

.ghost-card{
  border-bottom:1px solid var(--paper-line);
  padding: 16px 0;
}
.ghost-card:first-child{ padding-top:0; }
.ghost-card:last-child{ border-bottom:none; }

.ghost-card-head{
  display:flex;
  align-items:baseline;
  gap:10px;
  flex-wrap:wrap;
}
.ghost-name-ja{
  font-family: var(--serif);
  font-size:1.28rem;
  font-weight:600;
  color: var(--ink);
}
.ghost-name-en{
  font-size:.78rem;
  color: var(--ink-soft);
  font-style: italic;
}

.ghost-stats{
  display:flex;
  gap:16px;
  flex-wrap:wrap;
  margin:6px 0 8px;
  font-size:.78rem;
  color: var(--ink-soft);
}
.ghost-stats b{ color: var(--ink); font-weight:600; }

.ghost-evidence{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  margin-bottom:8px;
}
.evidence-tag{
  font-size:.68rem;
  padding:3px 8px;
  border-radius:999px;
  background: var(--paper-alt);
  border:1px solid var(--line);
  color: var(--ink-soft);
}

.ghost-tip{
  margin:0;
  font-size:.84rem;
  line-height:1.6;
  color: var(--ink-soft);
}

.empty-state{
  text-align:center;
  padding: 60px 20px;
  color: var(--ink-soft);
}
.empty-state .glyph{
  font-family: var(--serif);
  font-size:2.4rem;
  display:block;
  margin-bottom:10px;
  color: var(--danger-dim);
}

/* ---------- footer ---------- */
.app-footer{
  border-top:1px solid var(--line);
  padding:12px 18px;
  font-size:.7rem;
  color: var(--ink-dim);
}
.app-footer code{
  background: var(--panel-alt);
  padding:1px 5px;
  border-radius:4px;
}



/* 追加: 決定表示・証拠タグの強調 */
.solved-banner{
  background: #1f4d3f;
  border:1px solid var(--accent);
  color:#eafff6;
  border-radius:10px;
  padding:10px 12px;
  margin-bottom:14px;
  font-size:.82rem;
  text-align:center;
}
.evidence-tag.is-hit{
  background: var(--accent-dim);
  border-color: var(--accent);
  color:#d6f5ea;
  font-weight:600;
}
.mimic-note{
  font-size:.72rem;
  color:#e0bd8a;
  background:#33291a;
  border:1px solid #6b5327;
  border-radius:6px;
  padding:5px 8px;
  margin:0 0 8px;
}

</style>
</head>

            </div>
          </div>
        </div>
      </div>

      <div class="rail-block">
        <h2>ハント時の正気度</h2>
        <p class="rail-hint">基準は50%。ハントが起きた瞬間の体感で選ぶ</p>
        <div class="band-grid" id="sanityGrid">
          <button type="button" class="band-btn" data-band="low"><strong>低い</strong><span>50%未満</span></button>
          <button type="button" class="band-btn" data-band="normal"><strong>普通</strong><span>50%前後</span></button>
          <button type="button" class="band-btn" data-band="high"><strong>高い</strong><span>50%超</span></button>
        </div>
      </div>

      <div class="rail-block">
        <h2>足の速さ</h2>
        <p class="rail-hint">基準は普通(1.7m/s)。ハント中の体感で選ぶ</p>
        <div class="band-grid band-grid-4" id="speedGrid">

        </div>
      </div>

      <button class="reset-btn" id="resetBtn" type="button">条件をリセット</button>
    </section>

    <section class="journal" aria-label="結果">
      <div class="journal-page" id="results"></div>
    </section>

  </main>

  <footer class="app-footer">
    <p>証拠3つの組み合わせは全30体でユニークです。数値は目安のため、最終判断はゲーム内ジャーナルを優先してください。</p>
  </footer>

</div>

<script>

const state = { evidence: {}, sanityBand: null, speedBand: null };

const SANITY_BANDS = {
  low:    { min: 0,  max: 49  },
  normal: { min: 45, max: 55  },
  high:   { min: 51, max: 100 },
};
const SPEED_BANDS = {
  slow:     { min: 0.0, max: 1.49 },
  normal:   { min: 1.5, max: 1.99 },
  fast:     { min: 2.0, max: 2.69 },
  veryfast: { min: 2.7, max: 5.0  },
};

let DATA = null;

function init(){
  DATA = GHOST_DATA;
  document.querySelectorAll('.ev-btn').forEach(btn => {
    btn.addEventListener('click', () => setEvidence(btn.dataset.key, btn.dataset.mode));
  });
  bindBandGroup('sanityGrid', 'sanityBand');
  bindBandGroup('speedGrid', 'speedBand');
  document.getElementById('resetBtn').addEventListener('click', resetAll);
  render();
}

// 「あり」「なし」を1タップで指定。同じボタンをもう一度押すと未選択に戻る
function setEvidence(key, mode){
  if (state.evidence[key] === mode) delete state.evidence[key];
  else state.evidence[key] = mode;
  syncEvidenceUI(key);
  render();
}

function syncEvidenceUI(key){
  const cur = state.evidence[key] || 'none';
  const row = document.querySelector('.evidence-row[data-key="' + key + '"]');
  if (row) row.dataset.state = cur;
  document.querySelectorAll('.ev-btn[data-key="' + key + '"]').forEach(b => {
    b.classList.toggle('is-on', b.dataset.mode === cur);
  });
}

function bindBandGroup(containerId, stateKey){
  const c = document.getElementById(containerId);
  c.querySelectorAll('.band-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const band = btn.dataset.band;
      const same = state[stateKey] === band;
      state[stateKey] = same ? null : band;
      c.querySelectorAll('.band-btn').forEach(b =>
        b.classList.toggle('is-selected', !same && b === btn));
      render();
    });
  });
}

function resetAll(){
  state.evidence = {}; state.sanityBand = null; state.speedBand = null;
  document.querySelectorAll('.evidence-row').forEach(r => r.dataset.state = 'none');
  document.querySelectorAll('.ev-btn').forEach(b => b.classList.remove('is-on'));
  document.querySelectorAll('.band-btn').forEach(b => b.classList.remove('is-selected'));
  render();
}

// ミミックはゴーストオーブが常に「おまけ」で出るので、証拠を持つ扱いにする
function ghostHasEvidence(ghost, key){
  if (ghost.alwaysOrbs && key === 'orbs') return true;
  return ghost.evidence.includes(key);
}

function matchesGhost(ghost){
  for (const [key, mode] of Object.entries(state.evidence)){
    const has = ghostHasEvidence(ghost, key);
    if (mode === 'confirmed' && !has) return false;
    if (mode === 'excluded'  &&  has) return false;
  }
  if (state.sanityBand){
    const b = SANITY_BANDS[state.sanityBand];
    if (ghost.sanityMin > b.max || ghost.sanityMax < b.min) return false;
  }
  if (state.speedBand){
    const b = SPEED_BANDS[state.speedBand];
    if (ghost.speedMin > b.max || ghost.speedMax < b.min) return false;
  }
  return true;
}

function evidenceLabel(key){
  const e = DATA.evidenceTypes.find(e => e.key === key);
  return e ? e.ja : key;
}

function render(){
  const matches = DATA.ghosts.filter(matchesGhost);
  document.getElementById('matchCount').textContent = matches.length;

  const box = document.getElementById('results');
  box.innerHTML = '';

  if (matches.length === 0){
    box.innerHTML = '<div class="empty-state"><span class="glyph">—</span>' +
      '条件に一致するゴーストがいません。<br>証拠の選択を見直してみてください。</div>';
    return;
  }

  const confirmedCount = Object.values(state.evidence).filter(v => v === 'confirmed').length;
  if (matches.length === 1 && confirmedCount > 0){
    const b = document.createElement('div');
    b.className = 'solved-banner';
    b.textContent = 'この条件に当てはまるゴーストは1体だけです';
    box.appendChild(b);
  }

  matches.forEach(g => {
    const card = document.createElement('article');
    card.className = 'ghost-card';

    const tags = g.evidence.map(e => {
      const hit = state.evidence[e] === 'confirmed';
      return '<span class="evidence-tag' + (hit ? ' is-hit' : '') + '">' + evidenceLabel(e) + '</span>';
    }).join('');

    const mimicNote = g.alwaysOrbs
      ? '<p class="mimic-note">※上記3つに加え、ゴーストオーブが常に追加で出ます</p>' : '';

    card.innerHTML =
      '<div class="ghost-card-head">' +
        '<span class="ghost-name-ja">' + g.ja + '</span>' +
        '<span class="ghost-name-en">' + g.en + '</span>' +
      '</div>' +
      '<div class="ghost-stats">' +
        '<span>ハント正気度 <b>' + g.sanityLabel + '</b></span>' +
        '<span>速度 <b>' + g.speedLabel + '</b></span>' +
      '</div>' +
      '<div class="ghost-evidence">' + tags + '</div>' +
      mimicNote +
      '<p class="ghost-tip">' + g.tips + '</p>';
    box.appendChild(card);
  });
}

init();

</script>
